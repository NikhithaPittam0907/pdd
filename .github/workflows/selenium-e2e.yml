name: Selenium Web E2E Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    name: Run Selenium Web E2E Tests (300 Cases)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Pre-Create Report & Artifact Directories
        run: |
          mkdir -p "selenium_automation/reports/latest"
          mkdir -p "selenium_automation/Test Results/Excel"
          mkdir -p "selenium_automation/screenshots"
          mkdir -p "selenium_automation/logs"
          
          cd selenium_automation
          npm install

      - name: Run Selenium Test Suite & Generate Reports
        run: |
          cd selenium_automation
          npm run generate-tests
          npm run report
          
          if [ -f "summary.md" ]; then
            cat "summary.md" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Validate Artifacts Before Upload
        if: always()
        run: |
          if [ ! -f "selenium_automation/reports/latest/E2E_Report.xlsx" ]; then
            echo "ERROR: E2E_Report.xlsx missing in selenium_automation/reports/latest/"
            exit 1
          fi
          if [ ! -f "selenium_automation/reports/latest/index.html" ]; then
            echo "ERROR: index.html missing in selenium_automation/reports/latest/"
            exit 1
          fi
          echo "✔ Verified Enterprise Selenium reports exist."

      - name: Upload Artifacts to GitHub Actions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-automation-reports
          path: |
            selenium_automation/reports/latest/
            selenium_automation/reports/latest/E2E_Report.xlsx
            selenium_automation/Test Results/Excel/Execution_Report.xlsx
            selenium_automation/logs/
            selenium_automation/screenshots/
          retention-days: 30

  deploy-pages:
    name: Publish Selenium Reports to GitHub Pages
    needs: test
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Automation Artifacts
        uses: actions/download-artifact@v4
        with:
          name: selenium-automation-reports
          path: downloaded-reports

      - name: Consolidate Pages Site
        run: |
          mkdir -p public
          if [ -f downloaded-reports/index.html ]; then
            cp -r downloaded-reports/* public/
          else
            INDEX_DIR=$(find downloaded-reports -name "index.html" -exec dirname {} \; | head -n 1)
            if [ -n "$INDEX_DIR" ]; then
              cp -r "$INDEX_DIR"/* public/
            fi
          fi

          if [ ! -f public/E2E_Report.xlsx ]; then
            EXCEL_SRC=$(find downloaded-reports -name "E2E_Report.xlsx" | head -n 1)
            if [ -n "$EXCEL_SRC" ]; then
              cp "$EXCEL_SRC" public/E2E_Report.xlsx
            fi
          fi

          ls -la public/
          if [ ! -f public/index.html ]; then
            echo "ERROR: index.html was not found!"
            exit 1
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
