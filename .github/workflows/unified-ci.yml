name: Unified E2E Automation Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-all-tests:
    runs-on: macos-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Pre-Create Report Directories
        run: |
          mkdir -p Unified_Reports/Excel
          mkdir -p Unified_Reports/screenshots
          mkdir -p Unified_Reports/logs

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Web App
        run: flutter build web

      - name: Deploy Web App to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          keep_files: true
        continue-on-error: true

      - name: Run Security Automation Tests
        run: |
          cd security_automation
          mvn clean test -Dsurefire.suiteXmlFiles=testng.xml || true
        continue-on-error: true

      - name: Run Load Automation Tests
        run: |
          cd load_automation
          mvn clean test -Dsurefire.suiteXmlFiles=testng.xml || true
        continue-on-error: true

      - name: Run Selenium Web E2E Tests
        run: |
          cd selenium_automation
          mvn clean test -Dsurefire.suiteXmlFiles=testng.xml || true
        continue-on-error: true
        
      - name: Build Android APK
        run: flutter build apk --debug
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium & UIAutomator2
        run: |
          npm install -g appium
          appium driver install uiautomator2@2.45.1 || true

      - name: Start Appium Server
        run: appium --log appium.log &

      - name: Run Appium Mobile E2E Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            cd automation
            mvn clean test -Dsurefire.suiteXmlFiles=testng.xml || true
        continue-on-error: true

      - name: Consolidate Dynamic Reports
        if: always()
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl reportlab
          python consolidate_reports.py

      - name: Upload Unified Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-reports
          path: Unified_Reports/
          retention-days: 30

      - name: Publish Reports to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./Unified_Reports
          destination_dir: reports/latest
          keep_files: true
