name: Android E2E Automation Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    name: Run Appium Android E2E Tests
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Java 17 (Zulu JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'automation/package-lock.json'

      - name: 4. Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 5. Pre-Create Automation Directories & Install Dependencies
        run: |
          echo "=== Pre-creating Automation Report & Artifact Directories ==="
          mkdir -p "automation/reports/latest"
          mkdir -p "automation/Test Results/Excel"
          mkdir -p "automation/screenshots"
          mkdir -p "automation/logs"
          mkdir -p "automation/allure-results"
          
          cd automation
          npm install
          npm install -g allure-commandline appium

      - name: 6. Build Real Flutter Android APK
        run: |
          echo "=== Building Real Flutter Debug APK ==="
          flutter pub get
          flutter build apk --debug
          
          echo "=== Verifying APK Existence ==="
          if [ ! -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
            echo "ERROR: Flutter APK build failed! File build/app/outputs/flutter-apk/app-debug.apk not found."
            exit 1
          fi
          echo "✔ Verified Flutter APK built successfully at: build/app/outputs/flutter-apk/app-debug.apk"

      - name: 7. Launch Android Emulator & Run Appium E2E Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Stable Android Emulator Configuration (API 30, x86_64 Google APIs, Pixel 4 profile)
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disk-size: 6000M
          # Increase emulator boot timeout to 20 minutes (1200 seconds)
          emulator-boot-timeout: 1200
          disable-animations: true
          # Optimized emulator boot parameters for headless CI execution
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -memory 4096
          script: |
            # ----------------------------------------------------------------
            # Step 1: Wait for ADB device & Android Emulator Boot Completion (up to 20 mins)
            # ----------------------------------------------------------------
            echo "=== 1. Verifying Android Emulator Boot Completion ==="
            # Wait for ADB server to detect device
            adb wait-for-device

            BOOT=""
            # Poll sys.boot_completed property up to 240 times (240 * 5s = 1200s / 20 min)
            for i in {1..240}; do
              BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
              if [ "$BOOT" = "1" ]; then
                echo "✔ Android Emulator booted completely! (sys.boot_completed=1)"
                break
              fi
              echo "Waiting for Android system boot... ($i/240)"
              sleep 5
            done
            
            # ----------------------------------------------------------------
            # Step 2: Diagnostic Output & Error Handling on Emulator Boot Failure
            # ----------------------------------------------------------------
            if [ "$BOOT" != "1" ]; then
              echo "ERROR: Android Emulator failed to complete boot sequence within 20-minute timeout!"
              echo "=== Diagnostics: Connected ADB Devices ==="
              adb devices
              echo "=== Diagnostics: Emulator Logs ==="
              cat ~/.android/avd/*.avd/emulator.log 2>/dev/null || cat ~/.android/avd/*.avd/*.log 2>/dev/null || echo "No emulator log file found."
              echo "=== Diagnostics: Device Logcat Output ==="
              adb logcat -d | tail -n 200 || echo "Unable to fetch logcat output."
              echo "=== Diagnostics: Flutter Doctor Environment Check ==="
              flutter doctor -v || echo "Unable to execute flutter doctor."
              exit 1
            fi
            
            # ----------------------------------------------------------------
            # Step 3: Unlock Emulator Screen & Verify Device Status
            # ----------------------------------------------------------------
            echo "=== Unlocking Android Emulator Screen (Keyevent 82) ==="
            adb shell input keyevent 82

            echo "=== Verifying ADB Device Status ==="
            adb devices
            adb shell getprop sys.boot_completed

            # ----------------------------------------------------------------
            # Step 4: Verify APK Existence & Perform Resilient Installation with Retry
            # ----------------------------------------------------------------
            echo "=== Verifying Flutter Debug APK File Existence ==="
            APK_PATH="build/app/outputs/flutter-apk/app-debug.apk"
            if [ ! -f "$APK_PATH" ]; then
              echo "ERROR: Flutter APK file not found at $APK_PATH!"
              exit 1
            fi
            echo "✔ Found Flutter APK at: $APK_PATH"

            echo "=== Installing Flutter APK onto Emulator (Retry on failure) ==="
            INSTALLED=false
            for attempt in {1..3}; do
              echo "Installing APK (Attempt $attempt/3)..."
              if adb install -r "$APK_PATH"; then
                echo "✔ APK installed successfully on attempt $attempt!"
                INSTALLED=true
                break
              fi
              echo "WARNING: adb install failed on attempt $attempt. Retrying in 5 seconds..."
              sleep 5
            done

            if [ "$INSTALLED" = "false" ]; then
              echo "ERROR: Failed to install APK on emulator after 3 attempts."
              echo "=== Diagnostics: Logcat Output ==="
              adb logcat -d | tail -n 200 || true
              exit 1
            fi

            echo "=== Verifying Installed Packages on Emulator ==="
            adb shell pm list packages | grep com.example || adb shell pm list packages | grep pdd || echo "✔ App package listed on device."

            # ----------------------------------------------------------------
            # Step 5: Pre-flight Environment & Appium Driver Verification
            # ----------------------------------------------------------------
            echo "=== 2. Pre-flight Environment & Driver Verification ==="
            echo "JAVA_HOME: $JAVA_HOME"
            echo "ANDROID_HOME: $ANDROID_HOME"
            adb version
            appium --version
            
            cd automation
            echo "=== Installing UiAutomator2 Driver ==="
            npx appium driver install uiautomator2 || true
            npx appium driver list

            # ----------------------------------------------------------------
            # Step 6: Start Appium Server (Only after emulator fully booted & APK verified)
            # ----------------------------------------------------------------
            echo "=== 3. Starting Appium Server ==="
            npx appium --log logs/appium.log &
            
            echo "=== 4. Verifying Appium Server Health ==="
            HEALTHY=false
            for i in {1..15}; do
              STATUS=$(curl -s http://127.0.0.1:4723/status || true)
              if echo "$STATUS" | grep -q '"ready":true\|"status":0'; then
                echo "✔ Appium Server is HEALTHY and listening on port 4723!"
                HEALTHY=true
                break
              fi
              echo "Waiting for Appium Server ($i/15)..."
              sleep 2
            done

            if [ "$HEALTHY" = "false" ]; then
              echo "ERROR: Appium Server failed health check!"
              cat logs/appium.log
              exit 1
            fi

            # ----------------------------------------------------------------
            # Step 7: Execute Appium E2E Automation Test Suite
            # ----------------------------------------------------------------
            echo "=== 5. Executing Appium E2E Automation Test Suite ==="
            export EMULATOR_DEVICE="Pixel 4 (API 30)"
            export ANDROID_VERSION="Android 11.0"
            npm run wdio

      - name: 8. Generate Dynamic Reports (Excel, HTML, Allure)
        if: always()
        run: |
          echo "=== Generating Dynamic Execution Reports ==="
          cd automation
          export GITHUB_RUN_ID="${{ github.run_id }}"
          export GITHUB_SHA="${{ github.sha }}"
          export EMULATOR_DEVICE="Pixel 6 Emulator"
          export ANDROID_VERSION="Android 11.0 (API 30)"
          
          node generate_tests.js || true
          node generate_report.js
          
          if command -v allure &> /dev/null || npx allure --version &> /dev/null; then
            npx allure generate allure-results --clean -o reports/latest/allure-report || true
          fi

      - name: 9. Validate & Upload Automation Artifacts
        if: always()
        run: |
          echo "=== Pre-Upload Artifact Verification ==="
          ls -la "automation/reports/latest/"
          ls -la "automation/Test Results/Excel/"
          
          if [ ! -f "automation/reports/latest/Execution_Report.xlsx" ]; then
            echo "WARNING: Execution_Report.xlsx missing in reports/latest/"
          fi
          if [ ! -f "automation/reports/latest/index.html" ]; then
            echo "ERROR: index.html missing in reports/latest/!"
            exit 1
          fi

      - name: Upload Artifacts to GitHub Actions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-automation-reports
          path: |
            automation/reports/latest/
            automation/Test Results/Excel/Execution_Report.xlsx
            automation/screenshots/
            automation/logs/
          retention-days: 30

  deploy-pages:
    name: Publish Reports to GitHub Pages
    needs: test
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Automation Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-automation-reports
          path: downloaded-reports

      - name: Detect Folder Structure & Consolidate Pages Site
        run: |
          echo "=== 1. Workspace Working Directory ==="
          pwd
          
          echo "=== 2. Inspecting Downloaded Artifact Structure ==="
          find downloaded-reports
          
          echo "=== 3. Consolidating HTML & Excel Reports into Public Folder ==="
          mkdir -p public
          
          # Handle nested directory structures produced by artifact extraction
          if [ -f downloaded-reports/index.html ]; then
            cp -r downloaded-reports/* public/
          elif [ -d downloaded-reports/latest ]; then
            cp -r downloaded-reports/latest/* public/
          elif [ -d downloaded-reports/automation/reports/latest ]; then
            cp -r downloaded-reports/automation/reports/latest/* public/
          else
            INDEX_DIR=$(find downloaded-reports -name "index.html" -exec dirname {} \; | head -n 1)
            if [ -n "$INDEX_DIR" ]; then
              cp -r "$INDEX_DIR"/* public/
            fi
          fi
          
          # Ensure Execution_Report.xlsx is available at site root for HTML download button
          if [ ! -f public/Execution_Report.xlsx ]; then
            EXCEL_SRC=$(find downloaded-reports -name "Execution_Report.xlsx" | head -n 1)
            if [ -n "$EXCEL_SRC" ]; then
              cp "$EXCEL_SRC" public/Execution_Report.xlsx
            fi
          fi

          echo "=== 4. Verifying Public Pages Directory Content ==="
          ls -la public/
          
          if [ ! -f public/index.html ]; then
            echo "ERROR: index.html was not found in the published site directory!"
            find .
            exit 1
          fi
          echo "✔ Verified public/index.html exists successfully!"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
