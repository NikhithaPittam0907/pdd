name: Android Appium E2E Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Android Appium E2E Tests (300 Cases)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'automation/package-lock.json'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Pre-Create Automation Directories & Install Dependencies
        run: |
          mkdir -p "automation/reports/latest"
          mkdir -p "automation/Test Results/Excel"
          mkdir -p "automation/screenshots"
          mkdir -p "automation/logs"
          mkdir -p "automation/allure-results"
          
          cd automation
          npm install
          npm install -g allure-commandline appium

      - name: Build Real Flutter Android APK
        run: |
          flutter pub get
          flutter build apk --debug
          
          if [ ! -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
            echo "ERROR: Flutter APK build failed!"
            exit 1
          fi

      - name: Launch Android Emulator & Execute Appium E2E Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disk-size: 6000M
          emulator-boot-timeout: 1200
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -memory 4096
          script: bash automation/run_e2e_tests.sh

      - name: Generate Dynamic Reports (300 Cases)
        if: always()
        run: |
          cd automation
          export GITHUB_RUN_ID="${{ github.run_id }}"
          export GITHUB_SHA="${{ github.sha }}"
          
          node generate_tests.js
          node generate_report.js
          
          if [ -f "summary.md" ]; then
            cat "summary.md" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Validate & Upload Automation Artifacts
        if: always()
        run: |
          if [ ! -f "automation/reports/latest/Execution_Report.xlsx" ]; then
            echo "ERROR: Execution_Report.xlsx missing!"
            exit 1
          fi
          if [ ! -f "automation/reports/latest/index.html" ]; then
            echo "ERROR: index.html missing!"
            exit 1
          fi
          echo "✔ Verified Appium automation reports exist."

      - name: Upload Artifacts to GitHub Actions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-automation-reports
          path: |
            automation/reports/latest/
            automation/Test Results/Excel/Execution_Report.xlsx
            automation/screenshots/
            automation/logs/
          retention-days: 30
