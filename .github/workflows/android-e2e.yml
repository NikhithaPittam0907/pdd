name: Android E2E Automation

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  test:
    name: Run Appium E2E Tests
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 4. Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 5. Pre-Create Directories & Install Automation Dependencies
        run: |
          mkdir -p "automation/Test Results/Excel"
          mkdir -p "automation/reports/latest"
          mkdir -p "automation/screenshots"
          mkdir -p "automation/logs"
          mkdir -p "automation/allure-results"
          cd automation
          npm install
          npm install -g allure-commandline appium

      - name: 6. Build Real Flutter Android APK
        run: |
          flutter pub get
          flutter build apk --debug

      - name: 7. Start Android Emulator, Launch Appium & Execute Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: default
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          script: |
            echo "=== 1. Emulator Booted & Verified ==="
            adb devices
            
            echo "=== 2. Installing UiAutomator2 Driver ==="
            cd automation
            npx appium driver install uiautomator2@2.45.1
            
            echo "=== 3. Starting Appium Server ==="
            npx appium --log appium.log &
            
            echo "=== 4. Verifying Appium Server Health ==="
            for i in {1..15}; do
              if curl -s http://127.0.0.1:4723/status | grep -q "status"; then
                echo "Appium Server is HEALTHY and running on port 4723!"
                break
              fi
              echo "Waiting for Appium Server..."
              sleep 2
            done
            
            echo "=== 5. Executing Appium E2E Tests ==="
            npm run wdio

      - name: 8. Generate Dynamic Reports (Excel, HTML, Allure)
        if: always()
        run: |
          cd automation
          node generate_tests.js
          node generate_report.js
          if [ -d "allure-results" ] && [ "$(ls -A allure-results)" ]; then
            npx allure-commandline generate allure-results --clean -o reports/latest
          fi

      - name: 9. Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-automation-reports
          path: |
            automation/Test Results/Excel/Execution_Report.xlsx
            automation/reports/latest/index.html
            automation/screenshots/
            automation/logs/
          retention-days: 30

  deploy-pages:
    name: Publish Reports to GitHub Pages
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Automation Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-automation-reports
          path: reports

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'reports/latest'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish GitHub Action Summary
        if: always()
        run: |
          if [ -f reports/summary.md ]; then cat reports/summary.md >> $GITHUB_STEP_SUMMARY; fi
