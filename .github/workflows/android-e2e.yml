name: Android E2E Automation Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    name: Run Appium Android E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 1b. Enable KVM Hardware Acceleration
        run: |
          echo "=== Enabling KVM Permissions for Hardware Virtualization ==="
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: 2. Setup Java 17 (Zulu JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'automation/package-lock.json'

      - name: 4. Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 5. Pre-Create Automation Directories & Install Dependencies
        run: |
          echo "=== Pre-creating Automation Report & Artifact Directories ==="
          mkdir -p "automation/reports/latest"
          mkdir -p "automation/Test Results/Excel"
          mkdir -p "automation/screenshots"
          mkdir -p "automation/logs"
          mkdir -p "automation/allure-results"
          
          cd automation
          npm install
          npm install -g allure-commandline appium

      - name: 6. Build Real Flutter Android APK
        run: |
          echo "=== Building Real Flutter Debug APK ==="
          flutter pub get
          flutter build apk --debug
          
          echo "=== Verifying APK Existence ==="
          if [ ! -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
            echo "ERROR: Flutter APK build failed! File build/app/outputs/flutter-apk/app-debug.apk not found."
            exit 1
          fi
          echo "✔ Verified Flutter APK built successfully at: build/app/outputs/flutter-apk/app-debug.apk"

      - name: 7. Launch Android Emulator & Run Appium E2E Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disk-size: 6000M
          emulator-boot-timeout: 1200
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -memory 4096
          script: |
            echo "Waiting for emulator..."
            adb wait-for-device
            until adb shell getprop sys.boot_completed | grep -m 1 "1"; do echo "Still booting..."; sleep 5; done
            echo "Emulator booted successfully"

            echo "ADB Devices:"
            adb devices

            echo "Android Version:"
            adb shell getprop ro.build.version.release

            echo "API Level:"
            adb shell getprop ro.build.version.sdk

            echo "Boot Completed:"
            adb shell getprop sys.boot_completed

            # ----------------------------------------------------------------
            # Step 3: Optimize Settings & Unlock Screen
            # ----------------------------------------------------------------
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb shell input keyevent 82

            # ----------------------------------------------------------------
            # Step 4: Install Flutter APK onto Emulator
            # ----------------------------------------------------------------
            APK_PATH="build/app/outputs/flutter-apk/app-debug.apk"
            if [ ! -f "$APK_PATH" ]; then
              echo "ERROR: Flutter APK file not found at $APK_PATH!"
              exit 1
            fi
            echo "Installing APK onto Emulator..."
            adb install -r "$APK_PATH"

            echo "Verifying Installed Packages on Emulator:"
            adb shell pm list packages | grep com.example || true

            # ----------------------------------------------------------------
            # Step 5: Start Appium Server & Install Driver
            # ----------------------------------------------------------------
            echo "Starting Appium"
            cd automation
            npx appium driver install uiautomator2 || true
            
            npx appium > logs/appium.log 2>&1 &
            
            echo "Waiting for Appium Server Health Check..."
            HEALTHY=false
            j=1
            while [ "$j" -le 15 ]; do
              STATUS=$(curl -s http://127.0.0.1:4723/status || true)
              if echo "$STATUS" | grep -q '"ready":true' || echo "$STATUS" | grep -q '"status":0'; then
                echo "✔ Appium Server is HEALTHY and listening on port 4723!"
                HEALTHY=true
                break
              fi
              echo "Waiting for Appium Server ($j/15)..."
              sleep 2
              j=$((j + 1))
            done

            if [ "$HEALTHY" = "false" ]; then
              echo "ERROR: Appium Server failed health check!"
              cat logs/appium.log
              exit 1
            fi

            # ----------------------------------------------------------------
            # Step 6: Execute Appium WebdriverIO E2E Automation Suite
            # ----------------------------------------------------------------
            export EMULATOR_DEVICE="Pixel (API 30)"
            export ANDROID_VERSION="Android 11.0 (API 30)"
            npm run wdio

      - name: 8. Generate Dynamic Reports (Excel, HTML, Allure, Markdown)
        if: always()
        run: |
          echo "=== Generating Dynamic Execution Reports ==="
          cd automation
          export GITHUB_RUN_ID="${{ github.run_id }}"
          export GITHUB_SHA="${{ github.sha }}"
          export EMULATOR_DEVICE="Pixel (API 30)"
          export ANDROID_VERSION="Android 11.0 (API 30)"
          
          node generate_tests.js || true
          node generate_report.js
          
          if command -v allure &> /dev/null || npx allure --version &> /dev/null; then
            npx allure generate allure-results --clean -o reports/latest/allure-report || true
          fi
          
          if [ -f "summary.md" ]; then
            cat "summary.md" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 9. Validate & Upload Automation Artifacts
        if: always()
        run: |
          echo "=== Pre-Upload Artifact Verification ==="
          mkdir -p "automation/reports/latest"
          mkdir -p "automation/Test Results/Excel"
          mkdir -p "automation/screenshots"
          mkdir -p "automation/logs"
          mkdir -p "automation/allure-results"
          
          if [ -f "automation/Test Results/Excel/Execution_Report.xlsx" ] && [ ! -f "automation/reports/latest/Execution_Report.xlsx" ]; then
            cp "automation/Test Results/Excel/Execution_Report.xlsx" "automation/reports/latest/"
          fi

          touch "automation/screenshots/.gitkeep"
          touch "automation/logs/.gitkeep"
          touch "automation/allure-results/.gitkeep"

          ls -la "automation/reports/latest/"
          ls -la "automation/Test Results/Excel/"
          
          if [ ! -f "automation/reports/latest/Execution_Report.xlsx" ]; then
            echo "ERROR: Execution_Report.xlsx missing in reports/latest/"
            exit 1
          fi
          if [ ! -f "automation/reports/latest/index.html" ]; then
            echo "ERROR: index.html missing in reports/latest/!"
            exit 1
          fi
          echo "✔ Artifact validation successful."

      - name: Upload Artifacts to GitHub Actions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-automation-reports
          path: |
            automation/reports/latest/
            automation/Test Results/Excel/Execution_Report.xlsx
            automation/screenshots/
            automation/logs/
          retention-days: 30

  deploy-pages:
    name: Publish Reports to GitHub Pages
    needs: test
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Automation Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-automation-reports
          path: downloaded-reports

      - name: Detect Folder Structure & Consolidate Pages Site
        run: |
          echo "=== 1. Workspace Working Directory ==="
          pwd
          
          echo "=== 2. Inspecting Downloaded Artifact Structure ==="
          find downloaded-reports
          
          echo "=== 3. Consolidating HTML & Excel Reports into Public Folder ==="
          mkdir -p public
          
          if [ -f downloaded-reports/index.html ]; then
            cp -r downloaded-reports/* public/
          elif [ -d downloaded-reports/latest ]; then
            cp -r downloaded-reports/latest/* public/
          elif [ -d downloaded-reports/automation/reports/latest ]; then
            cp -r downloaded-reports/automation/reports/latest/* public/
          else
            INDEX_DIR=$(find downloaded-reports -name "index.html" -exec dirname {} \; | head -n 1)
            if [ -n "$INDEX_DIR" ]; then
              cp -r "$INDEX_DIR"/* public/
            fi
          fi
          
          if [ ! -f public/Execution_Report.xlsx ]; then
            EXCEL_SRC=$(find downloaded-reports -name "Execution_Report.xlsx" | head -n 1)
            if [ -n "$EXCEL_SRC" ]; then
              cp "$EXCEL_SRC" public/Execution_Report.xlsx
            fi
          fi

          echo "=== 4. Verifying Public Pages Directory Content ==="
          ls -la public/
          
          if [ ! -f public/index.html ]; then
            echo "ERROR: index.html was not found in the published site directory!"
            find .
            exit 1
          fi
          echo "✔ Verified public/index.html exists successfully!"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
