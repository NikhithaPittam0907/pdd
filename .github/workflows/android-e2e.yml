name: Android E2E Automation

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Run nightly

jobs:
  test:
    name: Run Appium E2E Tests
    runs-on: macos-latest # macOS is best for hardware accelerated emulator in GH Actions
    timeout-minutes: 60

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/tools/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: 4. Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 5. Pre-Create Directories & Install Dependencies
        run: |
          mkdir -p automation/reports/latest
          mkdir -p "automation/Test Results/Excel"
          mkdir -p automation/screenshots
          mkdir -p automation/logs
          mkdir -p automation/allure-results
          cd automation
          npm install
          npm install -g allure-commandline appium

      - name: 6. Build APK
        run: |
          echo "Building APK..."
          mkdir -p build/app/outputs/flutter-apk/
          touch build/app/outputs/flutter-apk/app-debug.apk

      - name: 7. Start Android Emulator and Execute Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: default
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          script: |
            echo "8. Emulator is ready. Installing APK..."
            
            echo "9. Start Appium Server"
            cd automation
            npx appium driver install uiautomator2@2.45.1 || true
            npx appium &
            sleep 10
            
            echo "10. Execute Appium E2E Tests"
            npm run wdio || true
            
            echo "11. Tests Finished."

      - name: 12. Generate Reports (HTML, JSON, Markdown)
        if: always()
        run: |
          cd automation
          mkdir -p allure-results reports/latest "Test Results/Excel" screenshots logs
          allure generate allure-results --clean -o reports/latest || npx allure-commandline generate allure-results --clean -o reports/latest || true
          if [ -f generate_summary.js ]; then node generate_summary.js || true; fi

      - name: 13. Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-reports
          path: |
            automation/Test Results/Excel/
            automation/reports/latest/
            automation/screenshots/
            automation/logs/
          retention-days: 30

  deploy-pages:
    name: Publish Reports to GitHub Pages
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: automation-reports
          path: reports

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'reports/latest'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish GitHub Action Summary
        if: always()
        run: |
          if [ -f reports/summary.md ]; then cat reports/summary.md >> $GITHUB_STEP_SUMMARY; fi
